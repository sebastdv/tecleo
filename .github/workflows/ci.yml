name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tecleo
          POSTGRES_PASSWORD: tecleo
          POSTGRES_DB: tecleo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecleo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Los tests de integración del server aplican las migraciones a esta base.
      DATABASE_URL_TEST: postgresql://tecleo:tecleo@localhost:5432/tecleo_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tecleo
          POSTGRES_PASSWORD: tecleo
          POSTGRES_DB: tecleo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecleo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tecleo:tecleo@localhost:5432/tecleo
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      WEB_ORIGIN: http://localhost:3100
      # Todo el tráfico de los tests sale de la misma IP.
      AUTH_RATE_LIMIT: '1000'
      RATE_LIMIT: '10000'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @tecleo/server db:deploy

      - run: pnpm --filter @tecleo/server db:seed

      - run: pnpm --filter @tecleo/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
