# Servicios de desarrollo local. Levantar con `pnpm db:up`.
name: tecleo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tecleo
      POSTGRES_PASSWORD: tecleo
      POSTGRES_DB: tecleo
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tecleo -d tecleo']
      interval: 2s
      timeout: 3s
      retries: 20
    # Docker Desktop en Mac tiene poca memoria compartida entre proyectos.
    mem_limit: 256m

volumes:
  postgres-data:
